<script>
(function () {
  var base = "https://dirk-ostwald.github.io";
  var deToEn = {
    "/": "/en/",
    "/index.html": "/en/",
    "/_part_1/100-Mathematische-Grundlagen.html": "/en/_part_1/100-Mathematical-Foundations.html",
    "/_part_1/104-Funktionen.html": "/en/_part_1/104-Functions.html",
    "/Referenzen.html": "/en/References.html"
  };
  var enToDe = {
    "/en/": "/",
    "/en/index.html": "/",
    "/en/_part_1/100-Mathematical-Foundations.html": "/_part_1/100-Mathematische-Grundlagen.html",
    "/en/_part_1/104-Functions.html": "/_part_1/104-Funktionen.html",
    "/en/References.html": "/Referenzen.html"
  };
  var path = window.location.pathname;
  var target = deToEn[path] || enToDe[path];
  if (!target) return;
  document.querySelectorAll("a.nav-link").forEach(function (link) {
    var text = link.textContent.trim();
    if (text === "English" || text === "Deutsch") {
      link.href = base + target;
    }
  });
}());
</script>
