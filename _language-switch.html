<script>
(function () {
  var base = "https://dirk-ostwald.github.io";
  var pageMap = {
    "/": "/en/",
    "/index.html": "/en/",
    "/Referenzen.html": "/en/References.html",
    "/_part_1/100-Mathematische-Grundlagen.html": "/en/_part_1/100-Mathematical-Foundations.html",
    "/_part_1/101-Sprache-und-Logik.html": "/en/_part_1/101-Language-and-Logic.html",
    "/_part_1/102-Mengen.html": "/en/_part_1/102-Sets.html",
    "/_part_1/103-Summen-Produkte-Potenzen.html": "/en/_part_1/103-Sums-Products-Powers.html",
    "/_part_1/104-Funktionen.html": "/en/_part_1/104-Functions.html",
    "/_part_1/105-Folgen-Grenzwerte-Stetigkeit.html": "/en/_part_1/105-Sequences-Limits-Continuity.html",
    "/_part_1/106-Differenzialrechnung.html": "/en/_part_1/106-Differential-Calculus.html",
    "/_part_1/107-Integralrechnung.html": "/en/_part_1/107-Integral-Calculus.html",
    "/_part_1/108-Vektoren.html": "/en/_part_1/108-Vectors.html",
    "/_part_1/109-Matrizen.html": "/en/_part_1/109-Matrices.html",
    "/_part_1/110-Deskriptivstatistiken.html": "/en/_part_1/110-Descriptive-Statistics.html",
    "/_part_2/200-Imperative-Programmierung.html": "/en/_part_2/200-Imperative-Programming.html"
  };
  var reversePageMap = {};
  Object.keys(pageMap).forEach(function (key) {
    reversePageMap[pageMap[key]] = key;
  });
  function headings() {
    return Array.prototype.slice.call(document.querySelectorAll("main.content h1[id], main.content h2[id], main.content h3[id], main.content h4[id]"));
  }
  function currentHeadingIndex() {
    var hash = window.location.hash;
    if (!hash) return "";
    var id = hash.slice(1);
    try {
      id = decodeURIComponent(id);
    } catch (error) {}
    var list = headings();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return String(i);
    }
    return "";
  }
  function scrollToHeadingIndex() {
    var params = new URLSearchParams(window.location.search);
    var value = params.get("h");
    if (value === null) return;
    var index = Number(value);
    var list = headings();
    if (Number.isInteger(index) && index >= 0 && index < list.length) {
      list[index].scrollIntoView();
      if (history.replaceState) {
        history.replaceState(null, "", window.location.pathname + "#" + list[index].id);
      }
    }
  }
  var path = window.location.pathname;
  var target = pageMap[path] || reversePageMap[path];
  if (target) {
    document.querySelectorAll("a.nav-link").forEach(function (link) {
      var text = link.textContent.trim();
      if (text === "English" || text === "Deutsch") {
        var index = currentHeadingIndex();
        link.href = base + target + (index ? "?h=" + index : "");
      }
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scrollToHeadingIndex);
  } else {
    scrollToHeadingIndex();
  }
}());
</script>
