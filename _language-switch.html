    "/en/_part_1/104-Functions.html": "/_part_1/104-Funktionen.html",

  if (!target) return;
  var rawHash = window.location.hash;
  var hash = rawHash;
  try {
    hash = decodeURIComponent(rawHash);
  } catch (error) {}
  var targetHash = isGerman ? deToEnHash[hash] : enToDeHash[hash];
  if (!targetHash && rawHash) targetHash = rawHash;
  document.querySelectorAll("a.nav-link").forEach(function (link) {
    var text = link.textContent.trim();
    if (text === "English" || text === "Deutsch") {
      link.href = base + target + (targetHash || "");
